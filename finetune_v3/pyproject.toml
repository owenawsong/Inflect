[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inflect-mini-v3-adapt"
version = "0.1.2"
description = "Explicit-alignment language and fixed-voice adaptation tools for Inflect Mini v3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.6,<3",
  "transformers>=4.57,<6",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "soundfile>=0.13,<1",
  "huggingface-hub>=0.36,<2",
  "loguru>=0.7,<1",
  "attrs>=24,<27",
  "phonemizer-fork==3.3.2",
  "espeakng-loader==0.2.4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
inflect-v3-adapt = "finetune_v3.cli:main"

[project.urls]
Homepage = "https://github.com/owenawsong/Inflect"

[tool.setuptools]
license-files = ["LICENSE"]
packages = ["finetune_v3"]
package-dir = {finetune_v3 = "."}
